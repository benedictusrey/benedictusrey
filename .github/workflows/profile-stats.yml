name: Refresh open-source profile cards

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: benedictusrey
          BRANCH_NAME: main
          UTC_OFFSET: '9'
          EXCLUDE_REPOS: benedictusrey,opencodex
          AUTO_PUSH: false
          THEME: tokyonight
          ANIMATION: none
          DURATION: '1.5'
          NAME: Benedictus RH
      - name: Generate GitHub Profile 3D Contrib
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: benedictusrey
      - name: Validate generated cards before publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          directory = Path('profile-summary-card-output/tokyonight')
          required = [
              directory / '0-profile-details.svg',
              directory / '1-repos-per-language.svg',
              directory / '2-most-commit-language.svg',
              directory / '3-stats.svg',
              directory / '4-productive-time.svg',
              Path('profile-3d-contrib/profile-night-rainbow.svg'),
          ]
          for path in required:
              content = path.read_text(encoding='utf-8')
              root = ElementTree.fromstring(content)
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              assert len(content) > 1000, path
              assert 'Something went wrong' not in content, path
              assert 'Could not resolve to a User' not in content, path
          print('All six required profile graphics exist and contain valid SVG.')
          PY
      - name: Commit refreshed cards
        run: |
          git add profile-summary-card-output profile-3d-contrib
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh open-source profile cards and contribution calendar'
          git push
