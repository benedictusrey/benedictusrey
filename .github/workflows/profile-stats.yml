name: Refresh public profile stats

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dashboard from public repository data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Commit refreshed dashboard
        run: |
          if git diff --quiet -- assets/stats.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          git commit -m 'Refresh public profile stats'
          git push
